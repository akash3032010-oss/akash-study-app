<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Tests - Safollo App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#121212] text-white font-sans min-h-screen pb-28">

    <!-- Top Header -->
    <header class="flex justify-between items-center px-5 py-4 border-b border-gray-800/60">
        <h1 class="text-2xl font-bold font-serif tracking-wide text-gray-100">Mock Tests</h1>
        <button class="text-xl text-gray-300 hover:text-white">
            <i class="fa-solid fa-bars"></i>
        </button>
    </header>

    <main class="p-4 space-y-4 max-w-md mx-auto">

        <!-- Live Mock Test Card -->
        <div class="bg-[#181a20] border border-blue-900/40 rounded-2xl p-5 space-y-4">
            <div class="flex justify-between items-start">
                <div>
                    <span class="text-[10px] font-bold text-red-500 uppercase tracking-wider flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> LIVE
                    </span>
                    <h2 class="text-xl font-extrabold text-gray-100 mt-1">ONLINE</h2>
                    <h3 class="text-lg font-bold text-blue-400">MOCK TEST</h3>
                    <p class="text-xs text-gray-400 mt-1">Daily 2 Minutes</p>
                </div>
                <div class="text-4xl text-blue-400">
                    <i class="fa-solid fa-file-signature"></i>
                </div>
            </div>
            
            <!-- FIXED: View Test button wrapeed in <a> tag -->
            <a href="chapters.html" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 text-sm transition-all duration-200 block text-center">
                <span>View Test</span>
                <i class="fa-solid fa-chevron-right text-xs"></i>
            </a>
        </div>

        <!-- Free Mock Test Section -->
        <div class="bg-[#141b16] border border-green-900/40 rounded-2xl p-5 space-y-4">
            <div>
                <h2 class="text-xl font-black text-gray-200">FREE</h2>
                <h3 class="text-lg font-bold text-emerald-400">Mock Test</h3>
                <p class="text-xs text-gray-400 mt-1">Make Your Self, Better Everyday.</p>
            </div>

            <!-- Features Grid FIXED: Turned divs into clickable links -->
            <div class="grid grid-cols-3 gap-2 text-center pt-2">
                <a href="index.html" class="bg-gray-900/60 p-2 rounded-xl border border-gray-800 hover:border-emerald-500 transition cursor-pointer flex flex-col items-center justify-center">
                    <i class="fa-solid fa-book-bookmark text-emerald-400 text-lg mb-1"></i>
                    <p class="text-[10px] font-bold text-gray-300">All Subjects</p>
                </a>
                
                <a href="chapters.html" class="bg-gray-900/60 p-2 rounded-xl border border-gray-800 hover:border-emerald-500 transition cursor-pointer flex flex-col items-center justify-center">
                    <i class="fa-solid fa-layer-group text-emerald-400 text-lg mb-1"></i>
                    <p class="text-[10px] font-bold text-gray-300">All Chapters</p>
                </a>
                
                <a href="#" class="bg-gray-900/60 p-2 rounded-xl border border-gray-800 hover:border-emerald-500 transition cursor-pointer flex flex-col items-center justify-center">
                    <i class="fa-solid fa-infinity text-emerald-400 text-lg mb-1"></i>
                    <p class="text-[10px] font-bold text-gray-300">Unlimited</p>
                </a>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation Bar FIXED: Increased z-index so Netlify badge doesn't block it -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#181818]/95 backdrop-blur-md border-t border-gray-800/80 py-2 px-6 flex justify-between items-center max-w-md mx-auto z-[9999]">
        <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-white text-xs gap-1">
            <i class="fa-solid fa-house text-lg"></i>
            <span>Home</span>
        </a>
        <a href="chapters.html" class="flex flex-col items-center text-gray-400 hover:text-white text-xs gap-1">
            <i class="fa-solid fa-graduation-cap text-lg"></i>
            <span>Courses</span>
        </a>
        <a href="test.html" class="flex flex-col items-center text-blue-400 text-xs gap-1">
            <div class="bg-blue-200/20 px-4 py-1 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-clipboard-list text-lg text-blue-400"></i>
            </div>
            <span class="font-semibold">Test</span>
        </a>
        <a href="dashboard.html" class="flex flex-col items-center text-gray-400 hover:text-white text-xs gap-1">
            <i class="fa-solid fa-circle-user text-lg"></i>
            <span>Dashboard</span>
        </a>
    </nav>

</body>
            </html>
