<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akash Study App</title>
    
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-yellow-400">Akash Study App</h1>
            <p class="text-slate-400 text-sm mt-1">Class 5 to 10 Study Portal</p>
        </header>

        <!-- Class Selector Tabs -->
        <div class="flex flex-wrap justify-center gap-2 mb-8">
            <button onclick="showClass(5)" class="px-4 py-2 bg-slate-800 hover:bg-yellow-500 hover:text-slate-900 rounded-lg font-medium transition">Class 5</button>
            <button onclick="showClass(6)" class="px-4 py-2 bg-slate-800 hover:bg-yellow-500 hover:text-slate-900 rounded-lg font-medium transition">Class 6</button>
            <button onclick="showClass(7)" class="px-4 py-2 bg-slate-800 hover:bg-yellow-500 hover:text-slate-900 rounded-lg font-medium transition">Class 7</button>
            <button onclick="showClass(8)" class="px-4 py-2 bg-slate-800 hover:bg-yellow-500 hover:text-slate-900 rounded-lg font-medium transition">Class 8</button>
            <button onclick="showClass(9)" class="px-4 py-2 bg-slate-800 hover:bg-yellow-500 hover:text-slate-900 rounded-lg font-medium transition">Class 9</button>
            <button onclick="showClass(10)" class="px-4 py-2 bg-slate-800 hover:bg-yellow-500 hover:text-slate-900 rounded-lg font-medium transition">Class 10</button>
        </div>

        <!-- Subject Cards Container -->
        <div id="subject-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- Dynamic Subjects will load here -->
        </div>
    </div>

    <!-- JavaScript for Class Selection -->
    <script>
        const subjectsData = {
            5: ["Mathematics", "Bengali", "English", "Science", "History", "Geography"],
            6: ["Mathematics", "Bengali", "English", "Science", "History", "Geography"],
            7: ["Mathematics", "Bengali", "English", "Science", "History", "Geography"],
            8: ["Mathematics", "Bengali", "English", "Physical Science", "Life Science", "History", "Geography"],
            9: ["Mathematics", "Bengali", "English", "Physical Science", "Life Science", "History", "Geography"],
            10: ["Mathematics", "Bengali", "English", "Physical Science", "Life Science", "History", "Geography"]
        };

        function showClass(classNum) {
            const container = document.getElementById('subject-container');
            container.innerHTML = '';
            
            const subs = subjectsData[classNum] || [];
            subs.forEach(subject => {
                const card = document.createElement('div');
                card.className = "bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <h3 class="text-xl font-bold text-yellow-400 mb-2">${subject}</h3>
                        <p class="text-slate-400 text-sm mb-4">Class ${classNum} complete notes, chapters, and practice sets.</p>
                    </div>
                    <button onclick="alert('Opening ${subject} for Class ${classNum}')" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-2 px-4 rounded-lg transition">
                        View Chapters
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // Default load Class 5 on start
        showClass(5);
    </script>
</body>
                </html>
