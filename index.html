<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdTech Portal - Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#121212] text-white font-sans min-h-screen pb-24">

    <!-- Top Header -->
    <header class="flex justify-between items-center px-5 py-4 border-b border-gray-800">
        <h1 class="text-2xl font-bold font-serif tracking-wide">My Dashboard</h1>
        <button class="text-xl text-gray-300 hover:text-white">
            <i class="fa-solid fa-bars"></i>
        </button>
    </header>

    <!-- Main Content Container -->
    <main class="p-4 space-y-4 max-w-md mx-auto">

        <!-- Class & Subject Filter Section -->
        <div class="bg-[#1c1c1e] p-3 rounded-2xl border border-gray-800 space-y-3">
            <!-- Class Selection Dropdown -->
            <div>
                <label class="text-xs text-gray-400 font-medium mb-1 block">Select Class</label>
                <div class="relative">
                    <select class="w-full bg-[#121212] text-white text-sm rounded-xl px-3 py-2.5 border border-gray-700 focus:outline-none focus:border-blue-500 appearance-none font-semibold">
                        <option value="5">CLASS 5</option>
                        <option value="6">CLASS 6</option>
                        <option value="7">CLASS 7</option>
                        <option value="8">CLASS 8</option>
                        <option value="9">CLASS 9</option>
                        <option value="10" selected>CLASS 10 (Currently Selected)</option>
                    </select>
                    <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </div>
                </div>
            </div>

            <!-- Subject Filter Dropdown -->
            <div>
                <label class="text-xs text-gray-400 font-medium mb-1 block">Select Subject</label>
                <div class="relative">
                    <select class="w-full bg-[#121212] text-white text-sm rounded-xl px-3 py-2.5 border border-gray-700 focus:outline-none focus:border-blue-500 appearance-none font-semibold">
                        <option value="all" selected>All Subjects</option>
                        <option value="math">Mathematics</option>
                        <option value="science">Physical Science / Life Science</option>
                        <option value="english">English</option>
                        <option value="bengali">Bengali</option>
                        <option value="history">History & Geography</option>
                    </select>
                    <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- User Profile Section -->
        <section class="flex items-center gap-4 py-2">
            <div class="relative">
                <div class="w-16 h-16 rounded-full border-2 border-gray-700 flex items-center justify-center bg-gray-900">
                    <i class="fa-solid fa-user text-2xl text-gray-400"></i>
                </div>
                <span class="absolute bottom-0 right-0 bg-gray-800 rounded-full p-1 text-xs text-gray-300">
                    <i class="fa-solid fa-plus"></i>
                </span>
            </div>
            <div>
                <h2 class="text-lg font-bold tracking-wide">AKASH CHOWDHURY</h2>
                <div class="flex items-center gap-2 text-gray-400 text-sm">
                    <span>******</span>
                    <i class="fa-regular fa-eye-slash text-xs cursor-pointer"></i>
                </div>
            </div>
        </section>

        <!-- Refer & Earn Card -->
        <div class="bg-[#172217] border border-green-900/50 rounded-2xl p-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-green-950 flex items-center justify-center text-green-400 text-xl">
                    <i class="fa-solid fa-sack-dollar"></i>
                </div>
                <div>
                    <h3 class="font-bold text-gray-200">Refer & Earn</h3>
                    <p class="text-xs text-gray-400">Total <span class="text-emerald-400 font-semibold">₹0 Rupees</span> Earned</p>
                </div>
            </div>
            <a href="#" class="flex items-center gap-2 text-green-400 font-semibold text-sm">
                <span>View All</span>
                <i class="fa-regular fa-circle-right text-lg"></i>
            </a>
        </div>

        <!-- My Total Coins Card -->
        <div class="bg-[#1c1c1e] border border-gray-800 rounded-2xl p-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-amber-950/40 flex items-center justify-center text-amber-500 text-xl">
                    <i class="fa-solid fa-coins"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-400 font-medium">My Total Coins</p>
                    <h3 class="font-bold text-orange-500 text-lg">0 Coins</h3>
                </div>
            </div>
            <a href="#" class="flex items-center gap-2 text-gray-300 font-semibold text-sm">
                <span>Earn FREE Coins</span>
                <i class="fa-regular fa-circle-right text-lg"></i>
            </a>
        </div>

        <!-- My Classes Card -->
        <div class="bg-[#1c1c1e] border border-gray-800 rounded-2xl p-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-blue-950/40 flex items-center justify-center text-blue-400 text-xl">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-400 font-medium">My Classes</p>
                    <h3 class="font-bold text-gray-200 text-sm">You have joined 0 Classes</h3>
                </div>
            </div>
            <a href="#" class="flex items-center gap-2 text-gray-300 font-semibold text-sm">
                <span>View All</span>
                <i class="fa-regular fa-circle-right text-lg"></i>
            </a>
        </div>

        <!-- Analytics Header -->
        <h2 class="text-lg font-bold pt-2 text-gray-200">My Analytics</h2>

        <!-- Chapterwise Mock Test Banner -->
        <div class="bg-[#0f2334] border border-blue-900/40 rounded-2xl p-5 flex items-center justify-between">
            <div>
                <h3 class="font-bold text-lg text-gray-100">Chapterwise Mock Test</h3>
                <p class="text-sm text-gray-400 mt-1">View Your Progress</p>
            </div>
            <div class="text-3xl text-blue-400">
                <i class="fa-solid fa-chart-column"></i>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#181818] border-t border-gray-800 py-2 px-6 flex justify-between items-center max-w-md mx-auto">
        <a href="#" class="flex flex-col items-center text-gray-400 hover:text-white text-xs gap-1">
            <i class="fa-solid fa-house text-lg"></i>
            <span>Home</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 hover:text-white text-xs gap-1">
            <i class="fa-solid fa-graduation-cap text-lg"></i>
            <span>Courses</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 hover:text-white text-xs gap-1">
            <i class="fa-solid fa-clipboard-list text-lg"></i>
            <span>Test</span>
        </a>
        <!-- Active Tab (Dashboard) -->
        <a href="#" class="flex flex-col items-center text-blue-400 text-xs gap-1">
            <div class="bg-blue-200/20 px-4 py-1 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-circle-user text-lg text-blue-400"></i>
            </div>
            <span class="font-semibold">Dashboard</span>
        </a>
    </nav>

</body>
        </html>
