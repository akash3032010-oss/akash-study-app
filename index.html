<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safollo Style - Home</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#121212] text-white font-sans min-h-screen pb-24">

    <!-- Top Header -->
    <header class="flex justify-between items-center px-5 py-4 border-b border-gray-800/60">
        <h1 class="text-2xl font-bold font-serif tracking-wide text-gray-100">Safollo</h1>
        <button class="text-xl text-gray-300 hover:text-white">
            <i class="fa-solid fa-bars"></i>
        </button>
    </header>

    <!-- Main Content Container -->
    <main class="p-4 space-y-4 max-w-md mx-auto">

        <!-- Class Selection Dropdown Bar -->
        <div class="relative">
            <select class="w-full bg-[#1c1c1e] text-gray-200 text-sm font-semibold rounded-xl px-4 py-3 border border-gray-800 focus:outline-none appearance-none">
                <option value="5">CLASS 5 (Currently Selected)</option>
                <option value="6">CLASS 6 (Currently Selected)</option>
                <option value="7">CLASS 7 (Currently Selected)</option>
                <option value="8">CLASS 8 (Currently Selected)</option>
                <option value="9">CLASS 9 (Currently Selected)</option>
                <option value="10" selected>CLASS 10 (Currently Selected)</option>
            </select>
            <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-gray-400">
                <i class="fa-solid fa-caret-down text-sm"></i>
            </div>
        </div>

        <!-- Offer Banner / Slider Card -->
        <div class="bg-gradient-to-r from-purple-900/40 via-indigo-900/40 to-slate-900 border border-purple-800/40 rounded-2xl p-4 relative overflow-hidden">
            <div class="flex justify-between items-start">
                <div class="space-y-1">
                    <span class="text-[10px] font-bold tracking-wider text-amber-400 uppercase bg-amber-950/60 border border-amber-800/50 px-2 py-0.5 rounded-md">Hurry Up!</span>
                    <h3 class="text-base font-extrabold text-white mt-1">FIRST DIVISION COURSE</h3>
                    <p class="text-xs font-semibold text-purple-200">MADHYAMIK 2027</p>
                    <div class="pt-2 flex items-center gap-2">
                        <span class="bg-yellow-400 text-black font-extrabold text-xs px-2 py-1 rounded">SPECIAL OFFER</span>
                    </div>
                    <p class="text-xs font-bold text-gray-300 pt-1">
                        ONLY @ <span class="line-through text-red-400">₹499</span> <span class="text-amber-400 text-sm">₹299</span>
                    </p>
                </div>
                <!-- Banner Image / Icon Placeholder -->
                <div class="w-20 h-20 bg-purple-800/30 rounded-full flex items-center justify-center border border-purple-500/30">
                    <i class="fa-solid fa-graduation-cap text-3xl text-purple-300"></i>
                </div>
            </div>
            <!-- Slider Dots -->
            <div class="flex justify-center gap-1.5 mt-3">
                <span class="w-2.5 h-2.5 rounded-full bg-white"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-gray-600"></span>
            </div>
        </div>

        <!-- Quick Action Buttons (2 Column Grid) -->
        <div class="grid grid-cols-2 gap-3">
            <!-- Button 1 -->
            <div class="bg-[#1c1c1e] border border-gray-800/80 rounded-2xl p-3 flex items-center justify-between cursor-pointer hover:bg-gray-800/50 transition">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-orange-950/50 flex items-center justify-center text-orange-400 text-base border border-orange-800/30">
                        <i class="fa-solid fa-clipboard-list"></i>
                    </div>
                    <span class="text-xs font-bold leading-tight text-gray-200">MADHYAMIK<br>RESULT</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
            </div>

            <!-- Button 2 -->
            <div class="bg-[#1c1c1e] border border-gray-800/80 rounded-2xl p-3 flex items-center justify-between cursor-pointer hover:bg-gray-800/50 transition">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-amber-950/50 flex items-center justify-center text-amber-400 text-base border border-amber-800/30">
                        <i class="fa-solid fa-bell"></i>
                    </div>
                    <span class="text-xs font-bold leading-tight text-gray-200">SET STUDY<br>REMINDER</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
            </div>
        </div>

        <!-- Full Width Large Feature Cards -->
        
        <!-- Suggestions Card -->
        <div class="bg-[#1c1c1e] border border-gray-800/80 rounded-2xl p-4 flex items-center justify-between cursor-pointer hover:bg-gray-800/40 transition">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-2xl bg-amber-950/40 flex items-center justify-center text-amber-400 text-2xl border border-amber-800/30">
                    <i class="fa-regular fa-lightbulb"></i>
                </div>
                <div>
                    <h3 class="font-extrabold text-sm text-gray-100 leading-snug">ALL SUBJECTS 90%<br>COMMON SUGGESTIONS</h3>
                </div>
            </div>
            <div class="w-8 h-8 rounded-full bg-gray-800/60 flex items-center justify-center text-gray-400">
                <i class="fa-solid fa-chevron-right text-xs"></i>
            </div>
        </div>

        <!-- Math Solution Card -->
        <div class="bg-[#1c1c1e] border border-gray-800/80 rounded-2xl p-4 flex items-center justify-between cursor-pointer hover:bg-gray-800/40 transition">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-2xl bg-red-950/40 flex items-center justify-center text-red-400 text-2xl border border-red-800/30">
                    <i class="fa-solid fa-ruler-combined"></i>
                </div>
                <div>
                    <h3 class="font-extrabold text-sm text-gray-100 leading-snug">MATH BOOK<br>FULL SOLUTION</h3>
                </div>
            </div>
            <div class="w-8 h-8 rounded-full bg-gray-800/60 flex items-center justify-center text-gray-400">
                <i class="fa-solid fa-chevron-right text-xs"></i>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#181818] border-t border-gray-800/80 py-2 px-6 flex justify-between items-center max-w-md mx-auto z-50">
        <!-- Active Tab (Home) -->
        <a href="#" class="flex flex-col items-center text-blue-400 text-xs gap-1">
            <div class="bg-blue-200/20 px-4 py-1 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-house text-lg text-blue-400"></i>
            </div>
            <span class="font-semibold">Home</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 hover:text-white text-xs gap-1">
            <i class="fa-solid fa-graduation-cap text-lg"></i>
            <span>Courses</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 hover:text-white text-xs gap-1">
            <i class="fa-solid fa-clipboard-list text-lg"></i>
            <span>Test</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 hover:text-white text-xs gap-1">
            <i class="fa-solid fa-circle-user text-lg"></i>
            <span>Dashboard</span>
        </a>
    </nav>

</body>
    </html>
