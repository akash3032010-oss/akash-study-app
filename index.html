<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses - Study App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      margin: 0;
      padding: 20px 20px 80px 20px; /* Bottom nav er jonno padding-bottom */
    }
    h1 {
      text-align: center;
    }
    .course-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 500px;
      margin: 0 auto;
    }
    .course-card {
      background-color: #1e293b;
      border-radius: 10px;
      padding: 20px;
      border: 1px solid #334155;
    }
    .course-title {
      font-size: 20px;
      font-weight: bold;
      color: #f59e0b;
      margin-bottom: 5px;
    }
    .author {
      font-size: 14px;
      color: #94a3b8;
    }
    .price {
      font-size: 18px;
      font-weight: bold;
      color: #10b981;
      margin: 10px 0;
    }
    .btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
    .unlocked-badge {
      background-color: #10b981;
      color: white;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      font-weight: bold;
    }
    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background-color: #1e293b;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      max-width: 350px;
      width: 90%;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 20px;
      cursor: pointer;
      color: #94a3b8;
    }
    .qr-img {
      width: 200px;
      height: 200px;
      margin: 15px 0;
      border-radius: 8px;
    }
    input[type="text"] {
      width: 90%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: white;
      text-align: center;
    }

    /* Bottom Navigation Styling */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #1e293b;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid #334155;
      z-index: 999;
    }
    .nav-item {
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .nav-item.active {
      color: #2563eb;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Courses</h1>

  <div class="course-container">
    
    <!-- Course 1: Spoken English -->
    <div class="course-card">
      <div class="course-title">Spoken English</div>
      <div class="author">- by Pranab Sir</div>
      <div class="price">Price: ₹499</div>
      <div id="action-spoken">
        <button class="btn" onclick="openPaymentModal('Spoken English', 499)">Buy Now</button>
      </div>
    </div>

    <!-- Course 2: Grammar Batch -->
    <div class="course-card">
      <div class="course-title">Grammar Batch</div>
      <div class="author">- by Pranab Sir</div>
      <div class="price">Price: ₹299</div>
      <div id="action-grammar">
        <button class="btn" onclick="openPaymentModal('Grammar Batch', 299)">Buy Now</button>
      </div>
    </div>

  </div>

  <!-- Payment Modal -->
  <div id="paymentModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3 id="modalTitle">Course Name</h3>
      <p style="margin: 5px 0;">Payable Amount: <b id="modalPrice" style="color: #10b981;">₹0</b></p>
      
      <!-- IMPORTANT: Change 'your-phonepe-qr.png' to your uploaded image path -->
      <img src="your-phonepe-qr.png" alt="PhonePe QR Code" class="qr-img" />
      <p style="font-size: 13px; color: #94a3b8;">Scan & Pay using PhonePe / Any UPI App</p>

      <input type="text" id="txnId" placeholder="Enter UTR / Transaction ID" />
      <button class="btn" onclick="verifyAndUnlock()">Submit & Unlock</button>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <div class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span>🏠 Home</span>
    </a>
    <a href="english.html" class="nav-item active">
      <span>🎓 Courses</span>
    </a>
  </div>

  <script>
    let selectedCourse = "";

    window.onload = function() {
      checkStatus();
    };

    function checkStatus() {
      if (localStorage.getItem("unlocked_Spoken English") === "true") {
        document.getElementById("action-spoken").innerHTML = '<div class="unlocked-badge">🔓 Course Unlocked</div>';
      }
      if (localStorage.getItem("unlocked_Grammar Batch") === "true") {
        document.getElementById("action-grammar").innerHTML = '<div class="unlocked-badge">🔓 Course Unlocked</div>';
      }
    }

    function openPaymentModal(courseName, price) {
      selectedCourse = courseName;
      document.getElementById("modalTitle").innerText = courseName;
      document.getElementById("modalPrice").innerText = "₹" + price;
      document.getElementById("paymentModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("paymentModal").style.display = "none";
      document.getElementById("txnId").value = "";
    }

    function verifyAndUnlock() {
      const txnId = document.getElementById("txnId").value.trim();
      if (txnId === "") {
        alert("Daya kore UPI Transaction ID / UTR number din!");
        return;
      }

      localStorage.setItem("unlocked_" + selectedCourse, "true");
      alert(selectedCourse + " Course successfully unlock hoye gechhe!");
      
      closeModal();
      checkStatus();
    }
  </script>

</body>
  </html>
