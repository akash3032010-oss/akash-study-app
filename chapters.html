<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses / Chapters - Safollo App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#121212] text-white font-sans min-h-screen pb-28">

    <!-- Top Header -->
    <header class="flex justify-between items-center px-5 py-4 border-b border-gray-800/60">
        <h1 class="text-2xl font-bold font-serif tracking-wide text-gray-100">All Courses</h1>
        <button class="text-xl text-gray-300 hover:text-white cursor-pointer">
            <i class="fa-solid fa-bars"></i>
        </button>
    </header>

    <main class="p-4 space-y-4 max-w-md mx-auto">

        <!-- Subject List Section -->
        <div class="space-y-3">
            <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider">Select Subject</h2>

            <!-- Bangla Card -->
            <div onclick="window.location.href='bangla.html'" class="bg-[#181a20] border border-gray-800 rounded-2xl p-4 flex items-center justify-between hover:border-emerald-500/50 transition cursor-pointer">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-blue-600/20 rounded-xl flex items-center justify-center text-blue-400 text-xl border border-blue-500/30">
                        <i class="fa-solid fa-book-open"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-gray-100">Bangla</h3>
                        <p class="text-xs text-gray-400">Chapters & Notes Available</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-500 text-xs"></i>
            </div>

            <!-- English Card -->
            <div onclick="window.location.href='english.html'" class="bg-[#181a20] border border-gray-800 rounded-2xl p-4 flex items-center justify-between hover:border-emerald-500/50 transition cursor-pointer">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-emerald-600/20 rounded-xl flex items-center justify-center text-emerald-400 text-xl border border-emerald-500/30">
                        <i class="fa-solid fa-language"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-gray-100">English</h3>
                        <p class="text-xs text-gray-400">Chapters & Notes Available</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-500 text-xs"></i>
            </div>

            <!-- Math Card -->
            <div onclick="window.location.href='math.html'" class="bg-[#181a20] border border-gray-800 rounded-2xl p-4 flex items-center justify-between hover:border-emerald-500/50 transition cursor-pointer">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-amber-600/20 rounded-xl flex items-center justify-center text-amber-400 text-xl border border-amber-500/30">
                        <i class="fa-solid fa-calculator"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-gray-100">Mathematics</h3>
                        <p class="text-xs text-gray-400">Chapters & Notes Available</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-500 text-xs"></i>
            </div>

            <!-- Science Card -->
            <div onclick="window.location.href='science.html'" class="bg-[#181a20] border border-gray-800 rounded-2xl p-4 flex items-center justify-between hover:border-emerald-500/50 transition cursor-pointer">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-purple-600/20 rounded-xl flex items-center justify-center text-purple-400 text-xl border border-purple-500/30">
                        <i class="fa-solid fa-atom"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-gray-100">Science</h3>
                        <p class="text-xs text-gray-400">Chapters & Notes Available</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-500 text-xs"></i>
            </div>

            <!-- History Card -->
            <div onclick="window.location.href='history.html'" class="bg-[#181a20] border border-gray-800 rounded-2xl p-4 flex items-center justify-between hover:border-emerald-500/50 transition cursor-pointer">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-rose-600/20 rounded-xl flex items-center justify-center text-rose-400 text-xl border border-rose-500/30">
                        <i class="fa-solid fa-landmark"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-gray-100">History</h3>
                        <p class="text-xs text-gray-400">Chapters & Notes Available</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-500 text-xs"></i>
            </div>

            <!-- Geography Card -->
            <div onclick="window.location.href='geography.html'" class="bg-[#181a20] border border-gray-800 rounded-2xl p-4 flex items-center justify-between hover:border-emerald-500/50 transition cursor-pointer">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-cyan-600/20 rounded-xl flex items-center justify-center text-cyan-400 text-xl border border-cyan-500/30">
                        <i class="fa-solid fa-globe"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-gray-100">Geography</h3>
                        <p class="text-xs text-gray-400">Chapters & Notes Available</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-500 text-xs"></i>
            </div>

        </div>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#181818]/95 backdrop-blur-md border-t border-gray-800/80 py-2 px-6 flex justify-between items-center max-w-md mx-auto z-[9999]">
        <!-- Home Link (Fixed with ./index.html) -->
        <a href="./index.html" class="flex flex-col items-center text-gray-400 hover:text-white active:text-blue-400 text-xs gap-1 cursor-pointer">
            <i class="fa-solid fa-house text-lg"></i>
            <span>Home</span>
        </a>

        <!-- Courses Link (Active) -->
        <a href="chapters.html" class="flex flex-col items-center text-blue-400 text-xs gap-1 cursor-pointer">
            <div class="bg-blue-200/20 px-4 py-1 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-graduation-cap text-lg text-blue-400"></i>
            </div>
            <span class="font-semibold">Courses</span>
        </a>

        <!-- Test Link -->
        <a href="test.html" class="flex flex-col items-center text-gray-400 hover:text-white active:text-blue-400 text-xs gap-1 cursor-pointer">
            <i class="fa-solid fa-clipboard-list text-lg"></i>
            <span>Test</span>
        </a>

        <!-- Dashboard Link -->
        <a href="dashboard.html" class="flex flex-col items-center text-gray-400 hover:text-white active:text-blue-400 text-xs gap-1 cursor-pointer">
            <i class="fa-solid fa-circle-user text-lg"></i>
            <span>Dashboard</span>
        </a>
    </nav>

</body>
                  </html>
